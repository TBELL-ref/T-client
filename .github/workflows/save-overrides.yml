name: Save User Overrides

on:
  repository_dispatch:
    types: [save-overrides]

permissions:
  contents: write

jobs:
  save:
    runs-on: ubuntu-latest
    if: github.event.client_payload.adminKey == secrets.ADMIN_SAVE_KEY
    steps:
      - uses: actions/checkout@v4
      - name: Write overrides.json
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload.overrides) }}
        run: |
          node -e "
          const fs = require('fs');
          const payload = process.env.PAYLOAD;
          const doc = typeof payload === 'string' ? JSON.parse(payload) : payload;
          fs.mkdirSync('docs/data', { recursive: true });
          fs.writeFileSync('docs/data/overrides.json', JSON.stringify(doc, null, 2));
          "
      - name: Commit and push
        run: |
          git config user.name "T-client Admin"
          git config user.email "admin@tclient.local"
          git add docs/data/overrides.json
          git diff --staged --quiet || git commit -m "chore: update overrides from admin console"
          git push
