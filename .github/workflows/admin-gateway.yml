name: Admin Gateway

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/admin-gateway.yml
  repository_dispatch:
  workflow_dispatch:
    inputs:
      admin_key:
        description: Admin key (same as ADMIN_SAVE_KEY secret)
        required: true
        type: string
      action:
        description: Action name
        required: true
        type: choice
        options:
          - save-overrides
          - save-keywords
          - enrich-company
          - trigger-collect
      payload_json:
        description: JSON payload (optional)
        required: false
        type: string
        default: "{}"

permissions:
  contents: write

jobs:
  push-guard:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Admin gateway registered."

  from-manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch from manual input
        uses: actions/github-script@v7
        with:
          script: |
            const adminKey = ${{ toJson(github.event.inputs.admin_key) }};
            const action = ${{ toJson(github.event.inputs.action) }};
            let payload = {};
            try {
              payload = JSON.parse(${{ toJson(github.event.inputs.payload_json) }} || "{}");
            } catch (e) {
              core.setFailed("payload_json must be valid JSON");
              return;
            }
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: action,
              client_payload: { adminKey, ...payload }
            });

  save-overrides:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'save-overrides'
    runs-on: ubuntu-latest
    steps:
      - name: Authorize
        run: |
          if [ "${{ github.event.client_payload.adminKey }}" != "${{ secrets.ADMIN_SAVE_KEY }}" ]; then
            echo "::error::Invalid admin key"
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Write overrides.json
        env:
          OVERRIDES: ${{ toJson(github.event.client_payload.overrides) }}
        run: |
          node -e "
          const fs = require('fs');
          const doc = JSON.parse(process.env.OVERRIDES);
          const text = JSON.stringify(doc, null, 2);
          fs.mkdirSync('docs/data', { recursive: true });
          fs.mkdirSync('data', { recursive: true });
          fs.writeFileSync('docs/data/overrides.json', text);
          fs.writeFileSync('data/overrides.json', text);
          "
      - name: Commit and push
        run: |
          git config user.name "T-client Admin"
          git config user.email "admin@tclient.local"
          git add docs/data/overrides.json data/overrides.json
          git diff --staged --quiet || git commit -m "chore: update overrides from admin console"
          git push

  save-keywords:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'save-keywords'
    runs-on: ubuntu-latest
    steps:
      - name: Authorize
        run: |
          if [ "${{ github.event.client_payload.adminKey }}" != "${{ secrets.ADMIN_SAVE_KEY }}" ]; then
            echo "::error::Invalid admin key"
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Write keywords.json
        env:
          KEYWORDS: ${{ toJson(github.event.client_payload.keywords) }}
          UPDATED_AT: ${{ github.event.client_payload.updatedAt }}
        run: |
          node -e "
          const fs = require('fs');
          const keywords = JSON.parse(process.env.KEYWORDS);
          const doc = {
            version: 1,
            updatedAt: process.env.UPDATED_AT || new Date().toISOString(),
            keywords
          };
          const text = JSON.stringify(doc, null, 2);
          fs.mkdirSync('docs/data', { recursive: true });
          fs.mkdirSync('data', { recursive: true });
          fs.writeFileSync('docs/data/keywords.json', text);
          fs.writeFileSync('data/keywords.json', text);
          "
      - name: Commit and push
        run: |
          git config user.name "T-client Admin"
          git config user.email "admin@tclient.local"
          git add docs/data/keywords.json data/keywords.json
          git diff --staged --quiet || git commit -m "chore: update crawl keywords from admin console"
          git push
      - name: Sync keywords to Google Sheets (private)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            const adminKey = context.payload.client_payload.adminKey;
            const keywords = context.payload.client_payload.keywords;
            await github.rest.repos.createDispatchEvent({
              owner: "meowdule",
              repo: "T-client",
              event_type: "sync-keywords",
              client_payload: { adminKey, keywords }
            });

  enrich-company:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'enrich-company'
    runs-on: ubuntu-latest
    steps:
      - name: Authorize
        run: |
          if [ "${{ github.event.client_payload.adminKey }}" != "${{ secrets.ADMIN_SAVE_KEY }}" ]; then
            echo "::error::Invalid admin key"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch bizno profile and update overrides
        env:
          COMPANY_ID: ${{ github.event.client_payload.companyId }}
          BIZ_NO: ${{ github.event.client_payload.bizNo }}
        run: node scripts/enrichOneBizno.mjs "$COMPANY_ID" "$BIZ_NO"
      - name: Commit and push
        env:
          COMPANY_ID: ${{ github.event.client_payload.companyId }}
        run: |
          git config user.name "T-client Admin"
          git config user.email "admin@tclient.local"
          git add docs/data/overrides.json data/overrides.json
          git diff --staged --quiet || git commit -m "chore: enrich company ${COMPANY_ID} from bizno"
          git push

  trigger-collect:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'trigger-collect'
    runs-on: ubuntu-latest
    steps:
      - name: Authorize
        run: |
          if [ "${{ github.event.client_payload.adminKey }}" != "${{ secrets.ADMIN_SAVE_KEY }}" ]; then
            echo "::error::Invalid admin key"
            exit 1
          fi
      - name: Start Lead Collector on private repo
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: "meowdule",
              repo: "T-client",
              event_type: "trigger-collect",
              client_payload: {
                adminKey: context.payload.client_payload.adminKey
              }
            });
