<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="T-client — QA 채용 리드 크롤링·영업 관리" />
    <!-- GitHub Pages only: set Vercel gateway URL (see docs/ADMIN_SETUP.md) -->
    <!-- <meta name="tclient-admin-gateway" content="https://YOUR-PROJECT.vercel.app/api/admin" /> -->
    <title>T-client</title>
    <link rel="icon" href="./favicon.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="./favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="./styles.css" />
    <script defer src="./icons.js"></script>
    <script defer src="./enrich-bizno.js"></script>
    <script defer src="./ui-select.js"></script>
    <script defer src="./admin.js"></script>
    <script defer src="./app.js"></script>
  </head>
  <body>
    <div class="app">
      <header class="site-header">
        <a class="brand" href="./" aria-label="T-client 홈">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-text">
            <span class="brand-name">T-client</span>
            <span class="brand-desc">QA 리드 크롤링 · 영업 콘솔</span>
          </span>
        </a>
        <div class="header-end">
          <div id="meta" class="meta"></div>
          <div class="admin-bar">
            <span id="adminBadge" class="admin-badge hidden" title="관리자 모드">관리자</span>
            <div class="admin-anchor">
              <button type="button" id="adminUnlockBtn" class="btn-ghost btn-admin" aria-expanded="false" aria-controls="adminPopover">
                <span class="btn-icon" data-icon="settings"></span>
                관리
              </button>
              <div id="adminPopover" class="admin-popover hidden" aria-hidden="true">
                <div id="adminLoginForm" class="admin-popover-section">
                  <p class="admin-popover-title">관리자 인증</p>
                  <p class="admin-popover-hint">비밀번호 입력 = 저장·토큰 사용에 동의</p>
                  <input type="password" id="adminPassword" class="admin-popover-input" placeholder="관리자 키" autocomplete="off" />
                  <button type="button" id="adminLoginBtn" class="btn-primary btn-sm">입장</button>
                </div>
                <div id="adminTools" class="admin-popover-section hidden">
                  <p class="admin-popover-hint">즐겨찾기·상세 수정 · 로컬 자동 저장</p>
                  <div class="admin-keyword-block">
                    <p class="admin-popover-title">크롤링 키워드</p>
                    <p class="admin-popover-hint">시트 기본값 · 제거 시 비활성(목록에서 숨김)</p>
                    <div id="keywordChips" class="keyword-chips" aria-live="polite"></div>
                    <div class="keyword-add-row">
                      <input type="text" id="keywordInput" class="admin-popover-input" placeholder="키워드 추가" autocomplete="off" />
                      <button type="button" id="keywordAddBtn" class="btn-sm">추가</button>
                    </div>
                  </div>
                  <div class="admin-popover-actions">
                    <button type="button" id="adminSaveKeywords" class="btn-primary btn-sm">키워드 반영</button>
                    <button type="button" id="adminTriggerCollect" class="btn-sm">크롤링 실행</button>
                    <button type="button" id="adminSaveGithub" class="btn-sm">저장 반영</button>
                    <button type="button" id="adminLogout" class="btn-sm">잠금</button>
                  </div>
                </div>
                <p id="adminStatus" class="admin-popover-status"></p>
              </div>
            </div>
          </div>
        </div>
      </header>

      <section id="dashboard" class="dashboard" aria-label="대시보드"></section>

      <section class="toolbar">
        <div class="search-box">
          <span class="search-icon" data-icon="search"></span>
          <input id="search" type="search" placeholder="회사명, 도메인, 업종 검색" />
        </div>
        <div class="filter-chips">
          <select id="grade" class="select-pill" aria-label="등급">
            <option value="">등급 전체</option>
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
          </select>
          <select id="action" class="select-pill" aria-label="액션">
            <option value="">액션 전체</option>
            <option value="proposal">제안 추천</option>
            <option value="meeting">미팅 추천</option>
            <option value="inquiry">문의 추천</option>
          </select>
          <select id="contact" class="select-pill" aria-label="담당자">
            <option value="">담당자 전체</option>
            <option value="yes">확보</option>
            <option value="no">미확보</option>
          </select>
          <select id="exclude" class="select-pill" aria-label="제외">
            <option value="">제외 전체</option>
            <option value="active">활성</option>
            <option value="excluded">제외</option>
          </select>
          <select id="tier" class="select-pill" aria-label="규모">
            <option value="">규모 전체</option>
            <option value="startup">스타트업·미확인</option>
            <option value="mid">중견</option>
            <option value="enterprise">대기업</option>
          </select>
          <select id="favorite" class="select-pill admin-only hidden" aria-label="즐겨찾기">
            <option value="">즐겨찾기 전체</option>
            <option value="yes">즐겨찾기만</option>
          </select>
        </div>
        <div class="toolbar-row">
          <div id="presets" class="presets"></div>
          <div class="toolbar-end">
            <select id="sort" class="select-pill" aria-label="정렬">
              <option value="priority">우선순위순</option>
              <option value="grade">등급순</option>
              <option value="recent">최근 수집순</option>
              <option value="name">회사명순</option>
            </select>
            <span id="resultCount" class="result-count"></span>
          </div>
        </div>
      </section>

      <div class="tabs-bar">
        <nav class="tabs" aria-label="보기 전환">
          <button type="button" data-tab="leads" class="tab active">리드</button>
          <button type="button" data-tab="posts" class="tab">전체 공고</button>
        </nav>
        <button type="button" id="btnAddCompany" class="btn-add-company admin-only hidden">회사 추가</button>
      </div>

      <main class="main-panels">
        <div id="leads" class="panel"></div>
        <div id="posts" class="panel hidden"></div>
      </main>
    </div>

    <div id="addCompanyModal" class="modal hidden" aria-hidden="true">
      <div class="modal-backdrop" data-close-add="1"></div>
      <div class="modal-panel modal-panel-sm" role="dialog" aria-labelledby="addCompanyTitle">
        <header class="modal-header">
          <h2 id="addCompanyTitle">회사 추가</h2>
          <button type="button" class="modal-close" data-close-add="1" aria-label="닫기">
            <span data-icon="x"></span>
          </button>
        </header>
        <div class="modal-body">
          <p class="muted add-company-hint">크롤링되지 않은 회사를 직접 등록합니다. 추가 후 상세에서 프로필·공고를 입력할 수 있습니다.</p>
          <div class="inline-grid">
            <div class="inline-row"><span class="inline-label">회사명</span><input type="text" id="add-co-name" class="inline-field" placeholder="(주)예시테크" required /></div>
            <div class="inline-row"><span class="inline-label">도메인</span><input type="text" id="add-co-domain" class="inline-field" placeholder="example.com" /></div>
            <div class="inline-row"><span class="inline-label">사업자번호</span><input type="text" id="add-co-bizno" class="inline-field" placeholder="000-00-00000" /></div>
          </div>
        </div>
        <footer class="detail-footer">
          <button type="button" class="btn-ghost btn-sm" data-close-add="1">취소</button>
          <button type="button" class="btn-primary" id="add-co-submit">추가</button>
        </footer>
      </div>
    </div>

    <div id="detailModal" class="modal hidden" aria-hidden="true">
      <div class="modal-backdrop" data-close="1"></div>
      <div class="modal-panel" role="dialog" aria-labelledby="detailTitle">
        <header class="modal-header">
          <h2 id="detailTitle"></h2>
          <div class="modal-actions">
            <button type="button" id="detailEditBtn" class="btn-icon-edit hidden" aria-label="수정" title="수정">
              <span data-icon="pencil"></span>
            </button>
            <button type="button" class="modal-close" data-close="1" aria-label="닫기">
              <span data-icon="x"></span>
            </button>
          </div>
        </header>
        <div id="detailBody" class="modal-body"></div>
        <div id="detailLoading" class="detail-loading hidden" aria-hidden="true">
          <div class="detail-loading-inner">
            <div class="detail-spinner" aria-hidden="true"></div>
            <p id="detailLoadingText">처리 중…</p>
          </div>
        </div>
      </div>
    </div>
    <div id="toastRoot" class="toast-root" aria-live="polite"></div>
  </body>
</html>
