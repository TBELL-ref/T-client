<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QA Lead Console</title>
    <link rel="stylesheet" href="./styles.css" />
    <script defer src="./app.js"></script>
  </head>
  <body>
    <div class="layout">
      <header class="top">
        <div>
          <p class="eyebrow">영업 리드 관리</p>
          <h1>QA Lead Console</h1>
        </div>
        <div id="meta" class="meta"></div>
      </header>

      <section id="kpi" class="kpi-grid"></section>

      <section class="filter-panel">
        <div class="filter-row">
          <input id="search" type="search" placeholder="회사명, 도메인, 이메일 검색" />
          <select id="grade">
            <option value="">등급 전체</option>
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
          </select>
          <select id="stage">
            <option value="">단계 전체</option>
            <option value="qualified">qualified</option>
            <option value="new">new</option>
            <option value="excluded">excluded</option>
          </select>
          <select id="contact">
            <option value="">담당자 전체</option>
            <option value="yes">담당자 확보</option>
            <option value="no">미확보</option>
          </select>
          <select id="report">
            <option value="">리포트 전체</option>
            <option value="yes">필요</option>
            <option value="no">불필요</option>
          </select>
          <select id="meeting">
            <option value="">미팅 전체</option>
            <option value="yes">필요</option>
            <option value="no">불필요</option>
          </select>
          <select id="exclude">
            <option value="">제외 전체</option>
            <option value="active">활성 리드</option>
            <option value="excluded">제외됨</option>
          </select>
        </div>
        <div class="filter-row secondary">
          <div id="presets" class="presets"></div>
          <select id="sort">
            <option value="priority">우선순위순</option>
            <option value="grade">등급순</option>
            <option value="recent">최근 수집순</option>
            <option value="name">회사명순</option>
          </select>
          <span id="resultCount" class="result-count"></span>
        </div>
      </section>

      <nav class="tabs" aria-label="보기 전환">
        <button data-tab="leads" class="active">리드 표</button>
        <button data-tab="groups">회사별 공고</button>
        <button data-tab="dedupe">중복 후보</button>
        <button data-tab="manual">수동 검토</button>
      </nav>

      <main>
        <div id="leads" class="panel"></div>
        <div id="groups" class="panel hidden"></div>
        <div id="dedupe" class="panel hidden"></div>
        <div id="manual" class="panel hidden"></div>
      </main>
    </div>
  </body>
</html>
